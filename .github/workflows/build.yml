name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: |
          set +e
          test -f VideoHunter/Plugin.swift || { echo "Plugin.swift missing"; exit 1; }
          python3 - <<'PY'
          p = 'VideoHunter/PlayerView.swift'
          s = open(p).read()
          s = s.replace("DispatchWorkItem { [weak self] in\n            guard let self = self else { return }", "DispatchWorkItem {")
          s = s.replace("DispatchQueue.main.async { [weak self] in\n            guard let self = self else { return }", "DispatchQueue.main.async {")
          s = s.replace("                self.showControls = false", "                showControls = false")
          s = s.replace("            if self.pipController == nil", "            if pipController == nil")
          s = s.replace("                self.pipController = AVPictureInPictureController", "                pipController = AVPictureInPictureController")
          open(p, 'w').write(s)
          PY
          grep -q "MARKETING_VERSION = 2.0" VideoHunter.xcodeproj/project.pbxproj || { echo "version is not 2.0"; exit 1; }
          ls VideoHunter
          xcodebuild -version
          xcodebuild -project VideoHunter.xcodeproj -target VideoHunter -configuration Release -sdk iphoneos SYMROOT=$RUNNER_TEMP/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > $RUNNER_TEMP/build.log 2>&1
          STATUS=$?
          echo $STATUS > $RUNNER_TEMP/status
          tail -n 200 $RUNNER_TEMP/build.log
          mkdir -p dist
          cp $RUNNER_TEMP/build.log dist/build.log
          echo $STATUS > dist/status.txt
          if [ $STATUS = 0 ]; then
            APP=$(find $RUNNER_TEMP/build -maxdepth 3 -name VideoHunter.app | head -1)
            echo app=$APP
            rm -rf Payload
            mkdir -p Payload
            cp -R $APP Payload/
            zip -qry dist/VideoHunter-unsigned.ipa Payload
          fi
          ls -lh dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f dist
          git commit -m 'build: repo source 2.0 and ipa [skip ci]' || echo nothing-to-commit
          git push origin HEAD:main || echo push-failed
          [ $STATUS = 0 ] || exit 1