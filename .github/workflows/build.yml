name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: |
          set +e
          curl -fL --retry 5 https://aka.doubaocdn.com/s/V5iYQxVsKX -o $RUNNER_TEMP/source.zip || { echo "download failed"; exit 1; }
          rm -rf $RUNNER_TEMP/src
          unzip -q $RUNNER_TEMP/source.zip -d $RUNNER_TEMP/src || { echo "unzip failed"; exit 1; }
          if [ ! -f $RUNNER_TEMP/src/VideoHunter/VideoHunter/Plugin.swift ]; then echo "source zip is stale: Plugin.swift missing"; exit 1; fi
          grep -q "MARKETING_VERSION = 2.0" $RUNNER_TEMP/src/VideoHunter/VideoHunter.xcodeproj/project.pbxproj || { echo "source zip is stale: version not 2.0"; exit 1; }
          cp -R $RUNNER_TEMP/src/VideoHunter/. .
          rm -f .github/workflows/build-ipa.yml
          ls VideoHunter
          xcodebuild -version
          xcodebuild -project VideoHunter.xcodeproj -target VideoHunter -configuration Release -sdk iphoneos SYMROOT=$RUNNER_TEMP/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > $RUNNER_TEMP/build.log 2>&1
          STATUS=$?
          echo $STATUS > $RUNNER_TEMP/status
          tail -n 200 $RUNNER_TEMP/build.log
          mkdir -p dist
          cp $RUNNER_TEMP/build.log dist/build.log
          echo $STATUS > dist/status.txt
          if [ $STATUS = 0 ]; then
            APP=$(find $RUNNER_TEMP/build -maxdepth 3 -name VideoHunter.app | head -1)
            echo app=$APP
            rm -rf Payload
            mkdir -p Payload
            cp -R $APP Payload/
            zip -qry dist/VideoHunter-unsigned.ipa Payload
          fi
          ls -lh dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f dist
          git commit -m 'build: source 2.0 and ipa [skip ci]' || echo nothing-to-commit
          git push origin HEAD:main || echo push-failed
          [ $STATUS = 0 ] || exit 1