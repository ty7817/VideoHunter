name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Import 2.2 source if needed
        env:
          SOURCE_URL: 'https://aka.doubaocdn.com/s/fnLntcn30h'
          SOURCE_SHA: '9cd8666657a97b46d4edd6cd94c133844adfa4a760a9a300e4cf02660cee1519'
        run: |
          set -euo pipefail
          if ! grep -q 'MARKETING_VERSION = 2.2' VideoHunter.xcodeproj/project.pbxproj 2>/dev/null || ! grep -q 'PhotoLibrarySaver' VideoHunter/ImageViews.swift 2>/dev/null; then
            echo '2.2 source marker missing, importing verified archive'
            curl -fL --retry 5 --retry-delay 3 --max-time 180 $SOURCE_URL -o $RUNNER_TEMP/source.zip
            printf '%s  %s\n' $SOURCE_SHA $RUNNER_TEMP/source.zip | shasum -a 256 -c -
            unzip -q $RUNNER_TEMP/source.zip -d $RUNNER_TEMP/source
            test -f $RUNNER_TEMP/source/VideoHunter/ImageViews.swift
            test -f $RUNNER_TEMP/source/VideoHunter/RemoteImageLoader.swift
            grep -q 'MARKETING_VERSION = 2.2' $RUNNER_TEMP/source/VideoHunter.xcodeproj/project.pbxproj
            grep -q 'PhotoLibrarySaver' $RUNNER_TEMP/source/VideoHunter/ImageViews.swift
            grep -q 'AsyncLimiter' $RUNNER_TEMP/source/VideoHunter/RemoteImageLoader.swift
            rm -rf VideoHunter VideoHunter.xcodeproj scripts
            cp -R $RUNNER_TEMP/source/VideoHunter .
            cp -R $RUNNER_TEMP/source/VideoHunter.xcodeproj .
            cp -R $RUNNER_TEMP/source/scripts .
            cp $RUNNER_TEMP/source/README.md .
            cp $RUNNER_TEMP/source/.gitignore .
          else
            echo 'repo already contains 2.2 source, building repo HEAD'
          fi
          grep -q 'MARKETING_VERSION = 2.2' VideoHunter.xcodeproj/project.pbxproj || { echo 'version is not 2.2'; exit 1; }
          test -f VideoHunter/ImageLibrary.swift || { echo 'ImageLibrary.swift missing'; exit 1; }
          test -f VideoHunter/ImageViews.swift || { echo 'ImageViews.swift missing'; exit 1; }
          test -f VideoHunter/RemoteImageLoader.swift || { echo 'RemoteImageLoader.swift missing'; exit 1; }
          grep -q 'onGoHome' VideoHunter/PlayerView.swift || { echo 'player home hook missing'; exit 1; }
          grep -q 'vhImage' VideoHunter/InjectedScript.swift || { echo 'image sniffer missing'; exit 1; }
          grep -q 'PhotoLibrarySaver' VideoHunter/ImageViews.swift || { echo 'photo permission fix missing'; exit 1; }
          grep -q 'AsyncLimiter' VideoHunter/RemoteImageLoader.swift || { echo 'image limiter missing'; exit 1; }
          ls VideoHunter

      - name: Build and publish
        run: |
          set +e
          xcodebuild -version
          xcodebuild -project VideoHunter.xcodeproj -target VideoHunter -configuration Release -sdk iphoneos SYMROOT=$RUNNER_TEMP/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > $RUNNER_TEMP/build.log 2>&1
          STATUS=$?
          echo $STATUS > $RUNNER_TEMP/status
          tail -n 220 $RUNNER_TEMP/build.log
          mkdir -p dist
          cp $RUNNER_TEMP/build.log dist/build.log
          echo $STATUS > dist/status.txt
          if [ $STATUS = 0 ]; then
            APP=$(find $RUNNER_TEMP/build -maxdepth 3 -name VideoHunter.app | head -1)
            echo app=$APP
            test -n $APP || { echo 'VideoHunter.app missing'; STATUS=1; echo 1 > dist/status.txt; }
          fi
          if [ $STATUS = 0 ]; then
            rm -rf Payload
            mkdir -p Payload
            cp -R $APP Payload/
            zip -qry dist/VideoHunter-unsigned.ipa Payload
          fi
          ls -lh dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f dist
          git rm -r --cached Payload >/dev/null 2>&1 || true
          git commit -m 'build: 2.2 source and ipa [skip ci]' || echo nothing-to-commit
          git push origin HEAD:main || echo push-failed
          [ $STATUS = 0 ] || exit 1
