name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [dist/**]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Import 2.5 source if needed
        env:
          SOURCE_URL: 'https://aka.doubaocdn.com/s/0TmDYdPSRV'
          SOURCE_SHA: 'd6eb7a956e9747ad67965c5109e2712602c91ed65b5af4a69a2100f97b08fd69'
        run: |
          set -euo pipefail
          if ! grep -q 'MARKETING_VERSION = 2.5' VideoHunter.xcodeproj/project.pbxproj 2>/dev/null \
             || [ ! -f VideoHunter/SettingsStore.swift ] \
             || [ ! -f VideoHunter/SettingsView.swift ] \
             || ! grep -q '2.5-settings-center-build3' VideoHunter/SettingsView.swift 2>/dev/null; then
            echo '2.5 source marker missing, importing verified archive'
            curl -fL --retry 5 --retry-delay 3 --max-time 180 "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
            printf '%s  %s\n' "$SOURCE_SHA" "$RUNNER_TEMP/source.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
            test -f "$RUNNER_TEMP/source/VideoHunter/SettingsStore.swift"
            test -f "$RUNNER_TEMP/source/VideoHunter/SettingsView.swift"
            grep -q 'MARKETING_VERSION = 2.5' "$RUNNER_TEMP/source/VideoHunter.xcodeproj/project.pbxproj"
            grep -q '2.5-settings-center-build3' "$RUNNER_TEMP/source/VideoHunter/SettingsView.swift"
            rm -rf VideoHunter VideoHunter.xcodeproj scripts
            cp -R "$RUNNER_TEMP/source/VideoHunter" .
            cp -R "$RUNNER_TEMP/source/VideoHunter.xcodeproj" .
            cp -R "$RUNNER_TEMP/source/scripts" .
            cp "$RUNNER_TEMP/source/README.md" .
            cp "$RUNNER_TEMP/source/.gitignore" .
          else
            echo 'repo already contains 2.5 source, building repo HEAD'
          fi
          grep -q 'MARKETING_VERSION = 2.5' VideoHunter.xcodeproj/project.pbxproj || { echo 'version is not 2.5'; exit 1; }
          test -f VideoHunter/SettingsStore.swift || { echo 'SettingsStore.swift missing'; exit 1; }
          test -f VideoHunter/SettingsView.swift || { echo 'SettingsView.swift missing'; exit 1; }
          grep -q '2.5-settings-center-build3' VideoHunter/SettingsView.swift || { echo 'settings center marker missing'; exit 1; }
          grep -q 'MediaInfoReader' VideoHunter/SettingsView.swift || { echo 'playback info reader missing'; exit 1; }
          grep -q 'PlaybackSession' VideoHunter/SettingsStore.swift || { echo 'PlaybackSession missing'; exit 1; }
          test -f VideoHunter/DownloadManager.swift || { echo 'DownloadManager.swift missing'; exit 1; }
          test -f VideoHunter/FramePolicy.swift || { echo 'FramePolicy.swift missing'; exit 1; }
          test -f VideoHunter/LibraryView.swift || { echo 'LibraryView.swift missing'; exit 1; }
          test -f VideoHunter/PrivacyInfo.xcprivacy || { echo 'PrivacyInfo.xcprivacy missing'; exit 1; }
          grep -q 'vhRoute' VideoHunter/InjectedScript.swift || { echo 'SPA route script missing'; exit 1; }
          grep -q 'AudioSession' VideoHunter/PlayerView.swift || { echo 'audio session code missing'; exit 1; }
          grep -q 'ImageIO' VideoHunter/RemoteImageLoader.swift || { echo 'image pipeline missing'; exit 1; }
          grep -q 'background(withIdentifier:' VideoHunter/DownloadManager.swift || { echo 'background URLSession missing'; exit 1; }
          grep -q 'handleEventsForBackgroundURLSession' VideoHunter/VideoHunterApp.swift || { echo 'background session app delegate missing'; exit 1; }
          grep -q 'canStartPictureInPictureAutomaticallyFromInline' VideoHunter/PlayerView.swift || { echo 'auto PiP missing'; exit 1; }

      - name: Test injected script
        run: node scripts/test-injected.mjs

      - name: Build and publish
        run: |
          set +e
          xcodebuild -version
          xcodebuild -project VideoHunter.xcodeproj -target VideoHunter -configuration Release -sdk iphoneos SYMROOT=$RUNNER_TEMP/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > $RUNNER_TEMP/build.log 2>&1
          STATUS=$?
          echo $STATUS > $RUNNER_TEMP/status
          tail -n 240 $RUNNER_TEMP/build.log
          mkdir -p dist
          cp $RUNNER_TEMP/build.log dist/build.log
          echo $STATUS > dist/status.txt
          if [ $STATUS = 0 ]; then
            APP=$(find $RUNNER_TEMP/build -maxdepth 3 -name VideoHunter.app | head -1)
            echo app=$APP
            test -n "$APP" || { echo 'VideoHunter.app missing'; STATUS=1; echo 1 > dist/status.txt; }
          fi
          if [ $STATUS = 0 ]; then
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry dist/VideoHunter-unsigned.ipa Payload
          fi
          ls -lh dist
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f dist
          git rm -r --cached Payload >/dev/null 2>&1 || true
          git commit -m 'build: 2.5 settings center source and ipa [skip ci]' || echo nothing-to-commit
          git push origin HEAD:main || echo push-failed
          [ $STATUS = 0 ] || exit 1
